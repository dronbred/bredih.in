server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  charset utf-8;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  # Безопасность: эти заголовки учитывают поисковики и аудит Lighthouse
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Включить после настройки HTTPS:
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location / {
    try_files $uri $uri/ =404;
  }
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }
  error_page 404 /404.html;

  # Strapi: API, админка и медиа на том же домене
  location ~ ^/(api|admin|uploads|content-manager|content-type-builder|upload|i18n|users-permissions|_health)(/|$) {
    proxy_pass http://cms:1337;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 50m;
  }
}
